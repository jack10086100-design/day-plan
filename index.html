<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日计划工具</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f4f6fb;
    --card:#ffffff;
    --primary:#4f6ef7;
    --primary-dark:#3a55e0;
    --text:#1f2430;
    --muted:#8a91a5;
    --border:#e6e9f2;
    --danger:#e5474f;
    --done:#b9bfcf;
  }
  body {
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app { max-width:760px; margin:0 auto; padding:24px 20px 80px; }

  header { text-align:center; margin-bottom:0; padding:8px 0 4px; }
  .header-row { display:flex; align-items:center; justify-content:space-between; }
  .app-title { font-size:22px; font-weight:700; letter-spacing:1px; }
  .app-title span { color:var(--primary); }
  .header-actions { display:flex; gap:6px; }
  .icon-btn {
    border:1px solid var(--border); background:#fff; color:var(--muted);
    border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .icon-btn:hover { border-color:var(--primary); color:var(--primary); }

  .date-bar {
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border-radius:16px; padding:12px 14px;
    margin:16px 0 14px; box-shadow:0 2px 10px rgba(79,110,247,.06);
  }
  .date-nav { display:flex; align-items:center; gap:8px; }
  .date-nav button {
    width:34px; height:34px; border-radius:10px; border:1px solid var(--border);
    background:#fff; color:var(--text); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .date-nav button:hover { border-color:var(--primary); color:var(--primary); }
  .date-display { font-size:18px; font-weight:700; min-width:150px; text-align:center; }
  .date-display .week { font-size:12px; color:var(--muted); font-weight:500; margin-top:2px; }
  .date-bar input[type="date"] {
    border:1px solid var(--border); border-radius:10px; padding:8px 10px;
    font-size:14px; color:var(--text); cursor:pointer; background:#fff;
  }

  .btn-copy {
    border:1px solid var(--border); background:#fff; color:var(--muted);
    border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px; transition:.15s;
  }
  .btn-copy:hover { border-color:var(--primary); color:var(--primary); }
  .btn-copy:disabled { opacity:.5; cursor:not-allowed; }

  .add-box {
    background:var(--card); border-radius:16px; padding:16px; box-shadow:0 2px 10px rgba(79,110,247,.06);
    display:flex; flex-direction:column; gap:12px;
  }
  .add-box h3 { font-size:14px; color:var(--muted); font-weight:600; }
  .time-row { display:flex; gap:8px; align-items:center; }
  .time-row input[type="time"] {
    flex:1; padding:10px; border:1px solid var(--border); border-radius:10px;
    font-size:15px; color:var(--text); background:#f8f9fd;
  }
  .time-row .sep { color:var(--muted); }
  .input-title {
    width:100%; padding:12px; border:1px solid var(--border); border-radius:10px;
    font-size:15px; color:var(--text); background:#f8f9fd;
  }
  .input-title:focus, .time-row input:focus { outline:none; border-color:var(--primary); background:#fff; }
  .add-actions { display:flex; gap:8px; }
  .add-note {
    flex:1; padding:12px; border:1px solid var(--border); border-radius:10px;
    font-size:14px; resize:none; height:44px; background:#f8f9fd; font-family:inherit;
  }
  .add-note:focus { outline:none; border-color:var(--primary); }
  .btn-add {
    padding:0 20px; border:none; border-radius:10px; background:var(--primary);
    color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .btn-add:hover { background:var(--primary-dark); }

  .section-head { display:flex; align-items:center; justify-content:space-between; margin:20px 0 10px; }
  .section-head h2 { font-size:15px; font-weight:700; }
  .section-head .count { font-size:13px; color:var(--muted); }

  .plan-list { display:flex; flex-direction:column; gap:10px; }
  .plan-item {
    background:var(--card); border-radius:14px; padding:14px 16px;
    box-shadow:0 2px 10px rgba(79,110,247,.05); border-left:4px solid var(--primary);
    display:flex; gap:12px; align-items:flex-start; transition:.15s;
  }
  .plan-item.done { border-left-color:#c8cee5; opacity:.65; }
  .plan-item.done .plan-title { text-decoration:line-through; color:var(--done); }
  .check {
    width:20px; height:20px; min-width:20px; border-radius:50%;
    border:2px solid #c8cee5; cursor:pointer; margin-top:2px;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
    background:#fff; transition:.15s;
  }
  .plan-item.done .check { background:#4caf6d; border-color:#4caf6d; }
  .plan-body { flex:1; }
  .plan-time {
    display:inline-flex; align-items:center; gap:6px;
    background:#eef1fb; color:var(--primary); font-weight:600; font-size:13px;
    padding:3px 10px; border-radius:20px; margin-bottom:6px;
  }
  .plan-time .arc { color:var(--muted); font-weight:400; }
  .plan-title { font-size:15px; font-weight:600; }
  .plan-note { font-size:13px; color:var(--muted); margin-top:4px; }
  .plan-ops { display:flex; gap:4px; align-items:center; }
  .op-btn {
    width:30px; height:30px; border:none; background:transparent; border-radius:8px;
    color:var(--muted); font-size:15px; cursor:pointer; transition:.15s;
  }
  .op-btn:hover { background:#f0f2f8; color:var(--danger); }

  .empty {
    text-align:center; padding:40px 20px; color:var(--muted);
    background:var(--card); border-radius:16px; border:2px dashed var(--border);
  }
  .empty .big { font-size:40px; margin-bottom:10px; }
  .empty button {
    margin-top:14px; padding:9px 18px; border:none; border-radius:10px;
    background:var(--primary); color:#fff; cursor:pointer; font-size:14px;
  }
  .toast {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:#fff; padding:10px 18px; border-radius:12px;
    font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:99;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- 修改计划弹窗 ---- */
  .modal-mask {
    position:fixed; inset:0; background:rgba(20,24,40,.45);
    display:none; align-items:center; justify-content:center; z-index:150; padding:20px;
  }
  .modal-mask.show { display:flex; }
  .modal {
    background:#fff; width:100%; max-width:400px; border-radius:18px; padding:22px;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
  }
  .modal h3 { font-size:16px; font-weight:700; margin-bottom:4px; }
  .modal .sub { font-size:12px; color:var(--muted); margin-bottom:16px; }
  .modal .m-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .modal .m-row input[type="time"] {
    flex:1; padding:10px; border:1px solid var(--border); border-radius:10px;
    font-size:15px; color:var(--text); background:#f8f9fd;
  }
  .modal .m-row .sep { color:var(--muted); }
  .modal input.m-input, .modal textarea.m-input {
    width:100%; padding:11px; border:1px solid var(--border); border-radius:10px;
    font-size:15px; margin-bottom:10px; background:#f8f9fd; color:var(--text); font-family:inherit;
  }
  .modal textarea.m-input { resize:none; height:40px; }
  .modal input.m-input:focus, .modal textarea.m-input:focus,
  .modal .m-row input:focus { outline:none; border-color:var(--primary); background:#fff; }
  .modal-actions { display:flex; gap:10px; margin-top:4px; }
  .modal-actions button { flex:1; padding:11px; border-radius:10px; font-size:14px; cursor:pointer; }
  .m-save { border:none; background:var(--primary); color:#fff; font-weight:600; }
  .m-save:hover { background:var(--primary-dark); }
  .m-cancel { border:1px solid var(--border); background:#fff; color:var(--muted); }

  /* ---- 密码门禁 ---- */
  .gate {
    position:fixed; inset:0; z-index:200; background:linear-gradient(135deg,#eef1fb,#f4f6fb);
    display:flex; align-items:center; justify-content:center; padding:20px;
    transition:opacity .25s;
  }
  .gate.hide { opacity:0; pointer-events:none; }
  .gate-card {
    background:#fff; width:100%; max-width:360px; border-radius:20px; padding:28px 24px;
    box-shadow:0 12px 40px rgba(79,110,247,.12); text-align:center;
  }
  .gate-card .lock-ico { font-size:40px; margin-bottom:8px; }
  .gate-card h2 { font-size:18px; font-weight:700; margin-bottom:4px; }
  .gate-card .sub { font-size:12px; color:var(--muted); margin-bottom:18px; }
  .gate-card input {
    width:100%; padding:12px; border:1px solid var(--border); border-radius:10px;
    font-size:15px; margin-bottom:10px; text-align:center; background:#f8f9fd;
  }
  .gate-card input:focus { outline:none; border-color:var(--primary); background:#fff; }
  .gate-card .err { color:var(--danger); font-size:12px; min-height:16px; margin-bottom:6px; }
  .gate-btn {
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--primary);
    color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .gate-btn:hover { background:var(--primary-dark); }
  .gate-tip { font-size:11px; color:var(--muted); margin-top:12px; line-height:1.6; }
</style>
</head>
<body>

<!-- 密码门禁 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="lock-ico">🔒</div>
    <h2 id="gateTitle">设置密码</h2>
    <div class="sub" id="gateSub">第一次使用，请设置一个密码</div>
    <input type="password" id="pass1" placeholder="请输入密码" autocomplete="off">
    <input type="password" id="pass2" placeholder="请再次输入密码" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <button class="gate-btn" id="gateBtn">确认</button>
    <div class="gate-tip" id="gateTip">提示：密码保存在你这个浏览器的本地，请牢记。关闭后重开需要重新输入。</div>
  </div>
</div>

<div class="app" id="app">
  <header>
    <div class="header-row">
      <div class="app-title">🗓️ <span>日计划工具</span></div>
      <div class="header-actions">
        <button class="icon-btn" id="changePassBtn" title="修改密码 🔐">🔑</button>
        <button class="icon-btn" id="lockBtn" title="锁定">🔒</button>
      </div>
    </div>
  </header>

  <div class="date-bar">
    <div class="date-nav">
      <button id="prevDay" title="前一天">‹</button>
      <div class="date-display">
        <div id="dateText"></div>
        <div id="weekText" class="week"></div>
      </div>
      <button id="nextDay" title="后一天">›</button>
    </div>
    <input type="date" id="datePicker">
  </div>

  <div class="add-box">
    <h3>＋ 新增计划</h3>
    <div class="time-row">
      <input type="time" id="startTime" value="09:00">
      <span class="sep">—</span>
      <input type="time" id="endTime" value="10:00">
    </div>
    <input type="text" id="titleInput" class="input-title" placeholder="要做什么？例如：完成周报初稿">
    <div class="add-actions">
      <input type="text" id="noteInput" class="add-note" placeholder="备注（可选）">
      <button class="btn-add" id="addBtn">添加</button>
    </div>
  </div>

  <div class="section-head">
    <h2 id="listTitle">当日计划</h2>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn-copy" id="copyYesterday">↩ 复制昨日</button>
      <span class="count" id="countText"></span>
    </div>
  </div>
  <div class="plan-list" id="planList"></div>

  <div class="toast" id="toast"></div>
</div>

<!-- 修改计划弹窗 -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <h3>✏️ 修改计划</h3>
    <div class="sub">修改时间段、任务或备注</div>
    <div class="m-row">
      <input type="time" id="editStart">
      <span class="sep">—</span>
      <input type="time" id="editEnd">
    </div>
    <input type="text" id="editTitle" class="m-input" placeholder="要做什么？">
    <textarea id="editNote" class="m-input" placeholder="备注（可选）"></textarea>
    <div class="modal-actions">
      <button class="m-cancel" id="editCancelBtn">取消</button>
      <button class="m-save" id="editSaveBtn">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  const storeKey = 'day-plan-tool-v1';
  const PASS_KEY='planner_pass_v1';
  const UNLOCK_KEY='planner_unlock_v1';
  const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  let current = today();
  let data = load();

  const $ = id => document.getElementById(id);

  function today(){
    const d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function fmt(d){
    const y=d.getFullYear(), m=pad(d.getMonth()+1), dd=pad(d.getDate());
    return y+'-'+m+'-'+dd;
  }
  function parse(s){ return new Date(s+'T00:00:00'); }
  function shift(s, delta){
    const d = parse(s); d.setDate(d.getDate()+delta); return fmt(d);
  }
  function load(){
    try{ return JSON.parse(localStorage.getItem(storeKey)) || {}; }
    catch(e){ return {}; }
  }
  function save(){ localStorage.setItem(storeKey, JSON.stringify(data)); }
  function dayPlans(d){ if(!data[d]) data[d]=[]; return data[d]; }
  function sortPlans(list){
    list.sort((a,b)=> (a.start||'00:00').localeCompare(b.start||'00:00'));
  }

  // ---- 密码工具 ----
  function enc(s){ return btoa(unescape(encodeURIComponent(s))); }
  function dec(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return ''; } }
  function getPass(){ return localStorage.getItem(PASS_KEY); }
  function setPass(p){ localStorage.setItem(PASS_KEY, enc(p)); }
  function isUnlocked(){ return sessionStorage.getItem(UNLOCK_KEY)==='1'; }
  function markUnlocked(){ sessionStorage.setItem(UNLOCK_KEY,'1'); }

  function enterApp(){
    $('gate').classList.add('hide');
    $('app').style.display='block';
    render();
  }
  function showGate(){
    $('app').style.display='none';
    $('gate').classList.remove('hide');
  }
  function setGate(mode){
    if(mode==='setup'){
      $('gateTitle').textContent='设置密码';
      $('gateSub').textContent='第一次使用，请设置一个密码（至少 4 位）';
      $('gateBtn').textContent='保存并进入';
      $('pass2').style.display='block';
      document._mode='setup';
    }else{
      $('gateTitle').textContent='请输入密码';
      $('gateSub').textContent='本工具已加密，输入密码解锁';
      $('gateBtn').textContent='解锁';
      $('pass2').style.display='none';
      document._mode='unlock';
    }
    $('pass1').value=''; $('pass2').value=''; $('gateErr').textContent='';
  }
  $('pass1').addEventListener('keydown',e=>{ if(e.key==='Enter') handleGate(); });
  $('pass2').addEventListener('keydown',e=>{ if(e.key==='Enter') handleGate(); });
  $('gateBtn').onclick=handleGate;

  function handleGate(){
    const m=document._mode;
    const err=$('gateErr');
    const p1=$('pass1').value;
    if(m==='setup'){
      const p2=$('pass2').value;
      if(p1.length<4){ err.textContent='密码至少 4 位'; return; }
      if(p1!==p2){ err.textContent='两次输入不一致，请重新输入'; return; }
      setPass(p1); markUnlocked(); toast('密码设置成功'); enterApp();
    }else{
      if(dec(getPass())===p1){ markUnlocked(); enterApp(); }
      else { err.textContent='密码错误，请重试'; $('pass1').value=''; $('pass1').focus(); }
    }
  }

  // 修改密码（需当前密码）
  function openChangePass(){
    const cur=prompt('请输入当前密码：');
    if(cur===null) return;
    if(dec(getPass())!==cur){ toast('当前密码错误'); return; }
    const np=prompt('请输入新密码（至少 4 位）：');
    if(!np || np.length<4){ toast('新密码无效'); return; }
    const np2=prompt('请再次输入新密码：');
    if(np!==np2){ toast('两次输入不一致'); return; }
    setPass(np); toast('密码已修改');
  }
  function lock(){ sessionStorage.removeItem(UNLOCK_KEY); showGate(); setGate('unlock'); }

  $('changePassBtn').onclick=openChangePass;
  $('lockBtn').onclick=lock;

  // ---- render ----
  function render(){
    const plans = dayPlans(current);
    sortPlans(plans);
    const dt = parse(current);
    $('dateText').textContent = dt.getMonth()+1+'月'+dt.getDate()+'日';
    $('weekText').textContent = WEEK[dt.getDay()] + (current===today()? ' · 今天':'');
    $('datePicker').value = current;
    $('countText').textContent = plans.length + ' 项';
    $('copyYesterday').disabled = false;

    const list = $('planList');
    list.innerHTML = '';
    if(plans.length===0){
      const div=document.createElement('div');
      div.className='empty';
      div.innerHTML = '<div class="big">🌤️</div><div>今天还没有安排，先添加一条计划吧</div>';
      const b=document.createElement('button');
      b.textContent='添加计划';
      b.onclick=()=>{ $('titleInput').focus(); window.scrollTo({top:0,behavior:'smooth'}); };
      div.appendChild(b);
      list.appendChild(div);
      return;
    }

    plans.forEach(p=>{
      const item=document.createElement('div');
      item.className='plan-item'+(p.done?' done':'');

      const check=document.createElement('div');
      check.className='check';
      check.textContent='✓';
      check.title='完成 / 取消完成';
      check.onclick=()=>{ p.done=!p.done; save(); render(); };

      const body=document.createElement('div');
      body.className='plan-body';
      const time=document.createElement('div');
      time.className='plan-time';
      time.innerHTML = '<span>'+esc(p.start||'--:--')+'</span><span class="arc">→</span><span>'+esc(p.end||'--:--')+'</span>';
      const title=document.createElement('div');
      title.className='plan-title'; title.textContent=p.title;
      body.appendChild(time);
      body.appendChild(title);
      if(p.note){
        const note=document.createElement('div');
        note.className='plan-note'; note.textContent=p.note;
        body.appendChild(note);
      }

      const ops=document.createElement('div');
      ops.className='plan-ops';
      const ed=document.createElement('button');
      ed.className='op-btn'; ed.textContent='✏️'; ed.title='编辑';
      ed.onclick=()=>openEdit(p);
      const del=document.createElement('button');
      del.className='op-btn'; del.textContent='🗑'; del.title='删除';
      del.onclick=()=>{
        const arr=dayPlans(current);
        arr.splice(arr.indexOf(p),1);
        save(); render(); toast('已删除');
      };
      ops.appendChild(ed);
      ops.appendChild(del);

      item.appendChild(check);
      item.appendChild(body);
      item.appendChild(ops);
      list.appendChild(item);
    });
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---- actions ----
  function addPlan(){
    const start=$('startTime').value || '09:00';
    const end=$('endTime').value || '';
    const title=$('titleInput').value.trim();
    if(!title){ toast('请填写要做什么'); $('titleInput').focus(); return; }
    const note=$('noteInput').value.trim();
    const list=dayPlans(current);
    list.push({id:Date.now()+Math.random(), start, end, title, note, done:false});
    save();
    $('titleInput').value='';
    $('noteInput').value='';
    render();
    toast('已添加');
  }

  function copyYesterday(){
    const yDate=shift(current,-1);
    const src=dayPlans(yDate).filter(p=>p&&p.title);
    if(src.length===0){ toast('昨日没有计划可复制'); return; }
    const dst=dayPlans(current);
    src.forEach(p=>{
      dst.push({id:Date.now()+Math.random(), start:p.start, end:p.end, title:p.title, note:p.note, done:false});
    });
    save(); render(); toast('已复制昨日 '+src.length+' 项计划');
  }

  function toast(msg){
    const t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600);
  }

  // ---- 修改计划 ----
  let editTarget=null;
  function openEdit(p){
    editTarget=p;
    $('editStart').value=p.start||'';
    $('editEnd').value=p.end||'';
    $('editTitle').value=p.title||'';
    $('editNote').value=p.note||'';
    $('editMask').classList.add('show');
    $('editTitle').focus();
  }
  function saveEdit(){
    if(!editTarget) return;
    const title=$('editTitle').value.trim();
    if(!title){ toast('要做什么不能为空'); return; }
    editTarget.start=$('editStart').value||'';
    editTarget.end=$('editEnd').value||'';
    editTarget.title=title;
    editTarget.note=$('editNote').value.trim();
    editTarget.done=editTarget.done||false;
    save(); closeEdit(); render(); toast('已保存修改');
  }
  function closeEdit(){
    editTarget=null;
    $('editMask').classList.remove('show');
  }
  $('editSaveBtn').onclick=saveEdit;
  $('editCancelBtn').onclick=closeEdit;
  $('editTitle').addEventListener('keydown',e=>{ if(e.key==='Enter') saveEdit(); });
  $('editNote').addEventListener('keydown',e=>{ if(e.key==='Enter') saveEdit(); });

  // ---- nav ----
  function goto(d){ current=d; render(); }

  $('prevDay').onclick=()=>goto(shift(current,-1));
  $('nextDay').onclick=()=>goto(shift(current,1));
  $('datePicker').onchange=e=>{ if(e.target.value) goto(e.target.value); };
  $('addBtn').onclick=addPlan;
  $('copyYesterday').onclick=copyYesterday;
  $('titleInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addPlan(); });
  $('noteInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addPlan(); });

  // ---- 启动：先判断密码 ----
  const stored=getPass();
  if(!stored){ setGate('setup'); }
  else if(isUnlocked()){ enterApp(); }
  else { setGate('unlock'); }
  $('pass1').focus();
  window._showGate=showGate; window._setGate=setGate;
})();
</script>
</body>
</html>
